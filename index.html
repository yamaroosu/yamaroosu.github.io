<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini MOBA Arena</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #1b1f2a;
    color: white;
    font-family: Arial, sans-serif;
}

#ui {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 10;
    background: rgba(0,0,0,0.5);
    padding: 10px;
    border-radius: 10px;
}

canvas {
    display: block;
}
</style>
</head>
<body>

<div id="ui">
    <div>Leben: <span id="hp">100</span></div>
    <div>Level: <span id="level">1</span></div>
    <div>Gold: <span id="gold">0</span></div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 20,
    speed: 4,
    hp: 100,
    maxHp: 100,
    level: 1,
    gold: 0
};

const keys = {};
const enemies = [];
const projectiles = [];

document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

canvas.addEventListener("click", e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const dx = mx - player.x;
    const dy = my - player.y;
    const len = Math.hypot(dx, dy);

    projectiles.push({
        x: player.x,
        y: player.y,
        vx: dx / len * 8,
        vy: dy / len * 8,
        size: 6
    });
});

function spawnEnemy() {
    let side = Math.floor(Math.random() * 4);
    let x, y;

    if (side === 0) { x = 0; y = Math.random() * canvas.height; }
    if (side === 1) { x = canvas.width; y = Math.random() * canvas.height; }
    if (side === 2) { x = Math.random() * canvas.width; y = 0; }
    if (side === 3) { x = Math.random() * canvas.width; y = canvas.height; }

    enemies.push({
        x, y,
        size: 18,
        hp: 30 + player.level * 5,
        speed: 1 + player.level * 0.1
    });
}

setInterval(spawnEnemy, 1500);

function update() {

    if (keys["w"]) player.y -= player.speed;
    if (keys["s"]) player.y += player.speed;
    if (keys["a"]) player.x -= player.speed;
    if (keys["d"]) player.x += player.speed;

    player.x = Math.max(0, Math.min(canvas.width, player.x));
    player.y = Math.max(0, Math.min(canvas.height, player.y));

    projectiles.forEach((p, pi) => {
        p.x += p.vx;
        p.y += p.vy;

        if (
            p.x < 0 || p.x > canvas.width ||
            p.y < 0 || p.y > canvas.height
        ) {
            projectiles.splice(pi, 1);
        }
    });

    enemies.forEach((enemy, ei) => {

        let dx = player.x - enemy.x;
        let dy = player.y - enemy.y;
        let len = Math.hypot(dx, dy);

        enemy.x += dx / len * enemy.speed;
        enemy.y += dy / len * enemy.speed;

        if (len < player.size + enemy.size) {
            player.hp -= 0.2;

            if (player.hp <= 0) {
                alert("Game Over!");
                location.reload();
            }
        }

        projectiles.forEach((p, pi) => {
            let dist = Math.hypot(p.x - enemy.x, p.y - enemy.y);

            if (dist < enemy.size + p.size) {
                enemy.hp -= 15;
                projectiles.splice(pi, 1);

                if (enemy.hp <= 0) {
                    enemies.splice(ei, 1);
                    player.gold += 10;

                    if (player.gold % 50 === 0) {
                        player.level++;
                        player.maxHp += 20;
                        player.hp = player.maxHp;
                    }
                }
            }
        });
    });

    document.getElementById("hp").textContent = Math.floor(player.hp);
    document.getElementById("level").textContent = player.level;
    document.getElementById("gold").textContent = player.gold;
}

function draw() {
    ctx.fillStyle = "#223";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#3fa9ff";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "red";
    enemies.forEach(e => {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.fillStyle = "gold";
    projectiles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
